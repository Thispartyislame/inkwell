<svg xmlns="http://www.w3.org/2000/svg" width="1in" height="1in" viewBox="100 100 72 72">
  <!-- viewBox starts at 100,100 and 1 unit = 1pt: red 40×40, blue 40×40 overlapping by 20×20, black 5×5 on top -->
  <rect x="100" y="100" width="40" height="40" fill="#ff0000"/>
  <rect x="120" y="120" width="40" height="40" fill="#0000ff"/>
  <rect x="130" y="130" width="5" height="5" fill="#000000"/>
  <rect x="160" y="100" width="4" height="4" fill="#fe0101"/>
</svg>
