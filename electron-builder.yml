appId: com.inkwell.app
productName: Inkwell
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - package.json
# better-sqlite3 ships Node-API prebuilt binaries that load in Electron as-is, so no native rebuild.
npmRebuild: false
asarUnpack:
  - '**/*.node'
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
  category: public.app-category.business
